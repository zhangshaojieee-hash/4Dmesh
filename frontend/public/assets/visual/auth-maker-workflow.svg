<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">4D printing workflow visual</title>
  <desc id="desc">Soft illustration of a maker workflow with a 3D printer, model preview, and toolpath cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EF"/>
      <stop offset="0.56" stop-color="#F6FBFC"/>
      <stop offset="1" stop-color="#EAF8F5"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB074"/>
      <stop offset="1" stop-color="#FF8C42"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DC3D2"/>
      <stop offset="1" stop-color="#5E9CAE"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6E7D9"/>
      <stop offset="1" stop-color="#7DD3C0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#38465A" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="960" height="640" rx="48" fill="url(#bg)"/>
  <circle cx="130" cy="130" r="86" fill="#FF8C42" opacity="0.12"/>
  <circle cx="810" cy="122" r="118" fill="#5E9CAE" opacity="0.12"/>
  <circle cx="784" cy="510" r="98" fill="#7DD3C0" opacity="0.16"/>
  <g filter="url(#shadow)">
    <rect x="140" y="118" width="292" height="394" rx="34" fill="#FFFFFF"/>
    <rect x="176" y="160" width="220" height="150" rx="24" fill="#F3F7F8"/>
    <path d="M218 270h148l-32-84h-80z" fill="url(#orange)" opacity="0.92"/>
    <path d="M254 186h80l-38-34z" fill="url(#blue)" opacity="0.9"/>
    <rect x="176" y="338" width="220" height="18" rx="9" fill="#E6ECEF"/>
    <rect x="176" y="372" width="166" height="18" rx="9" fill="#EDF2F4"/>
    <rect x="176" y="416" width="92" height="44" rx="22" fill="url(#orange)"/>
    <rect x="284" y="416" width="112" height="44" rx="22" fill="#F3F7F8"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="514" y="148" width="286" height="330" rx="38" fill="#FFFFFF"/>
    <path d="M590 234h154v134H590z" fill="#EDF4F5"/>
    <path d="M606 356h124" stroke="#5E9CAE" stroke-width="18" stroke-linecap="round" opacity="0.36"/>
    <path d="M618 244h94v84h-94z" fill="url(#mint)" opacity="0.88"/>
    <path d="M560 188h198" stroke="#E7ECEF" stroke-width="18" stroke-linecap="round"/>
    <path d="M560 424h106" stroke="url(#orange)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="742" cy="424" r="18" fill="url(#blue)"/>
  </g>
  <path d="M430 268c46-42 80-42 116 0" fill="none" stroke="#FF8C42" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 24"/>
  <path d="M430 358c56 44 96 44 146 0" fill="none" stroke="#7DD3C0" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 24"/>
</svg>
